services:
  app:
    image: golang:1.22
    container_name: agent_server_app
    working_dir: /workspace
    volumes:
      - ..:/workspace
    command: sh -c "go mod tidy && go run ./cmd/api"
    environment:
      APP_PORT: "8080"
      APP_ENV: "dev"
      APP_NAME: "agent-server-go"
      MYSQL_DSN: "root:root@tcp(mysql:3306)/agent?parseTime=true&charset=utf8mb4,utf8"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ""
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      MILVUS_ADDR: "milvus:19530"
      JWT_SECRET: "change_me"
      RATE_LIMIT_RPS: "5"
      RATE_LIMIT_BURST: "10"
      LLM_BASE_URL: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      LLM_API_KEY: ""
      LLM_MODEL: "qwen3-coder-plus"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      milvus:
        condition: service_started

  mysql:
    image: mysql/mysql-server:8.0
    container_name: agent_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: agent
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    container_name: agent_redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: agent_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus_etcd
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd:2379"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
    ports:
      - "2379:2379"

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: milvus_minio
    command: minio server /minio_data
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9000:9000"

  milvus:
    image: milvusdb/milvus:v2.4.8
    container_name: agent_milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on:
      - etcd
      - minio
    ports:
      - "19530:19530"
      - "9091:9091"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: agent_prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: agent_grafana
    ports:
      - "3000:3000"

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: agent_jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

volumes:
  mysql_data:
