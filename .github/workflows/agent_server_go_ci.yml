name: agent-server-go-ci

on:
  push:
    paths:
      - 'agent_server_go/**'
      - '.github/workflows/agent_server_go_ci.yml'
  pull_request:
    paths:
      - 'agent_server_go/**'
      - '.github/workflows/agent_server_go_ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent_server_go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go mod tidy
      - run: go test ./...
      - run: go build ./cmd/api
